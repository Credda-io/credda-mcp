name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: typecheck, test, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      # The worked example in examples/, run. It spawns the BUILT server --
      # `node dist/index.js`, over a real stdio transport, the way an MCP client
      # config launches it -- against a loopback stub of the API, and asserts
      # what comes back. The unit suites build the server in-process from src/
      # and would stay green if the published binary failed on boot; this is
      # what notices. It needs no key and no network.
      - run: npm run example

  # surface-parity WAS HERE AND IS DELETED ON PURPOSE.
  #
  # It checked this package's surface against `monorepo/packages/mcp` in
  # Credda-io/api. That package was the trust SDK, and both it and the product
  # it spoke to are retired. This repository is no longer a mirror of anything
  # in that monorepo -- it is an independent client of the engine API -- so the
  # check has no subject left. Repointing it at the engine would have been
  # inventing a parity that does not exist; leaving it would have failed every
  # run, and a red check nobody can fix is how a suite stops being read.
  #
  # What replaced it lives in this repository and is stronger, because it does
  # not need a cross-repo token to run: `src/writeSurface.test.ts`
  # pins the advertised tool list, invokes every tool through a real MCP client and asserts each is a GET with no body, and greps the source for any non-GET method literal.
  #
  # MONOREPO_READ_TOKEN is now unused by this workflow and can be revoked.

  secret-scan:
    name: gitleaks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      # GitHub's own secret scanning and push protection are not enabled on this
      # repo, so the scan runs here instead. The gitleaks container is used
      # directly rather than gitleaks-action, which needs an org licence key.
      - name: Scan the full history for committed secrets
        run: |
          docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:latest \
            detect --source=/repo --redact --no-banner --verbose
